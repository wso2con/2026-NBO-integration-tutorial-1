# Workflow engine — runs against a local Temporal development server, the
# same one ../backend uses. Each integration needs its own task queue so
# they don't conflict when sharing that Temporal server.
[ballerina.workflow]
mode = "LOCAL"
taskQueue = "EXPENSE_AGENT_QUEUE"

# Management API — exposed at http://localhost:8234/workflow/, same as
# ../backend (run only one of the two projects at a time - they'd otherwise
# collide on this port and on the default HTTP listener's port).
[ballerina.workflow.management]
enableManagementApi = true
port = 8234
enableBasicAuth = false

